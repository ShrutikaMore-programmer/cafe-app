name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Deploy to AWS EC2 via SSH
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd /home/ubuntu
          
          # 1. Clean up any existing repository folders to avoid sync issues
          rm -rf cafe-app
          
          # 2. Clone a completely fresh copy of your code
          git clone https://github.com{{ github.repository }}.git cafe-app
          cd cafe-app
          
          # 3. Build and launch the Docker container
          docker build -t cafe-image .
          docker stop cafe-container || true
          docker rm cafe-container || true
          docker run -d --name cafe-container -p 8000:8000 cafe-image